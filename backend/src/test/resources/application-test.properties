# DawaCheck - test profile
#
# An in-memory database per test run, built from the entities and seeded by
# SeedService exactly as a real first start is. The tests therefore assert
# against the knowledge base the application actually ships with, rather than
# against fixtures that could drift away from it.

spring.datasource.url=jdbc:h2:mem:dawacheck-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# No frontend folder to serve: the tests only exercise the API.
dawacheck.static-dir=
dawacheck.seed=true

# No OCR engine and no risk service, so the tests cover the documented
# fallbacks rather than depending on either being installed.
dawacheck.ocr.tessdata=
dawacheck.predict.url=

# Reminders are logged, not sent.
spring.mail.host=

server.port=0
logging.level.com.dawacheck=WARN
logging.level.org.hibernate=WARN
