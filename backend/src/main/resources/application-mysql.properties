# DawaCheck - MySQL profile (section 12 target schema)
#
#   CREATE DATABASE dawacheck CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
#   CREATE USER 'dawacheck'@'localhost' IDENTIFIED BY 'change-me';
#   GRANT ALL PRIVILEGES ON dawacheck.* TO 'dawacheck'@'localhost';
#
# utf8mb4 matters: alert explanations are stored in Hindi as well as English.

spring.datasource.url=jdbc:mysql://localhost:3306/dawacheck?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Kolkata
spring.datasource.username=dawacheck
spring.datasource.password=change-me
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
