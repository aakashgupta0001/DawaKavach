# DawaCheck - default profile
#
# Runs on a file-backed H2 database in MySQL compatibility mode so the whole
# application starts on a machine with no database server installed. The real
# deployment target of section 12 is MySQL: start with
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#
# and set the credentials in application-mysql.properties.

spring.application.name=dawacheck
server.port=8090

spring.datasource.url=jdbc:h2:file:./data/dawacheck;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Multipart limits mirrored in frontend/js/config.js
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

# Sessions: the frontend sends fetch(..., credentials: 'include')
server.servlet.session.timeout=2h
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Serve frontend/ straight from the sibling folder during development, so the
# pages and the API share an origin and no CORS is needed.
dawacheck.static-dir=file:../frontend/

# Where the frontend dev server runs, for the CORS fallback.
dawacheck.cors-origins=http://localhost:5500,http://127.0.0.1:5500

# Tesseract data directory. Left empty on purpose: without it the scanner
# reports that OCR is unavailable and offers the sample bills instead of
# pretending to have read the photo.
dawacheck.ocr.tessdata=
dawacheck.ocr.language=eng

# The trained interaction model behind POST /predict (section 11). Empty means
# use the built-in heuristic and label it as such.
dawacheck.predict.url=

# Load the demo family and knowledge base on an empty database.
dawacheck.seed=true

logging.level.com.dawacheck=INFO
